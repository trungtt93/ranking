<body>
<div class="container mt-5">

            <tr class="rank-1">
                <td class="rank"></td>
                <td class="user">
                    <img src="https://placehold.co/45?text=AV" alt="Avatar" class="avatar">
                    <span class="username">Alex Ryder</span>
                </td>
                <td class="score">25,480</td>
            </tr>
            <tr class="rank-2">
                <td class="rank"></td>
                <td class="user">
                    <img src="https://placehold.co/45?text=BV" alt="Avatar" class="avatar">

                </td>

            <tr class="rank-3">

                <td class="score">22,500</td>
            </tr>
            <tr>
                <td class="rank">4</td>

            <tr>

            </tr>
            </tbody>
        </table>
        <div class="row mt-4 footer">
            <div class="col-4 text-center"><a href="index.html"><i class="fa-3x fa-solid fa-ranking-star"></i></i></a></div>
            <div class="col-4 text-center"><a href="table.html"><i class="fa-3x fa-solid fa-cards"></i></a></div>
            <div class="col-4 text-center"><a href="analytic.html"><i class="fa-3x fa-solid fa-chart-simple"></i></a></div>
